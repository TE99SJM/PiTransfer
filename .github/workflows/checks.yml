name: PiTransfer checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run transfer and security tests
        run: python3 -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python3 -m compileall -q app.py core.py drive_helper.py camera.py camera_worker.py setup_config.py
      - name: Check installer syntax
        run: bash -n install.sh update.sh
      - name: Check browser JavaScript syntax
        run: node --check web/app.js
      - name: Install distro camera bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gphoto2
      - name: Check native camera streaming
        run: |
          /usr/bin/python3 -c 'import gphoto2'
          /usr/bin/python3 -m unittest tests.test_camera_native -v
